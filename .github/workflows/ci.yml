name: build-and-verify
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (OpenMPI + parallel HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make \
            libopenmpi-dev openmpi-bin \
            libhdf5-openmpi-dev

      - name: Configure
        # Debian/Ubuntu install the parallel HDF5 under flavour paths
        # (hdf5/openmpi/) that FindHDF5 neither discovers nor classifies
        # as parallel -- point at it explicitly.
        run: |
          HDF5_LIB=$(ls /usr/lib/*/libhdf5_openmpi.so | head -1)
          test -n "$HDF5_LIB" || { echo "::error::parallel HDF5 lib not found"; exit 1; }
          HDF5_INC=$(ls -d /usr/lib/*/hdf5/openmpi/include 2>/dev/null || echo /usr/include)
          echo "HDF5 parallel lib: $HDF5_LIB"
          cmake -B build \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpicxx \
            -DPIO_WITH_HDF5=ON -DPIO_WITH_ADIOS2=OFF \
            -DPIO_HDF5_LIBRARIES="$HDF5_LIB" \
            -DPIO_HDF5_INCLUDE_DIRS="$HDF5_INC" | tee cmake.log
          grep -q "HDF5 backend ON" cmake.log || {
            echo "::error::HDF5 backend was compiled out -- CI must exercise it"; exit 1; }

      - name: Build
        run: cmake --build build -j

      # runners have 2 vCPUs: oversubscribe for the 4-rank exercise
      - name: Smoke test (all backends, verified)
        env:
          MPIRUN: mpiexec --allow-run-as-root --oversubscribe
          LOCAL: 32
          PARTICLES: 10000
        run: ./scripts/smoke.sh
